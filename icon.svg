<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Samsung blue rounded square background -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#1428A0" />

  <!-- Stylized air conditioner unit (top rectangle with vents) -->
  <rect x="48" y="72" width="160" height="72" rx="12" fill="white" opacity="0.95" />

  <!-- Vent lines -->
  <line x1="72" y1="120" x2="184" y2="120" stroke="#1428A0" stroke-width="4" stroke-linecap="round" />
  <line x1="72" y1="132" x2="184" y2="132" stroke="#1428A0" stroke-width="4" stroke-linecap="round" />

  <!-- Wavy wind flow lines below the unit -->
  <path d="M 96 158 C 96 165, 100 167, 100 174 C 100 181, 96 183, 96 190" stroke="white"
    stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7" />
  <path d="M 128 158 C 128 165, 132 167, 132 174 C 132 181, 128 183, 128 190" stroke="white"
    stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85" />
  <path d="M 160 158 C 160 165, 164 167, 164 174 C 164 181, 160 183, 160 190" stroke="white"
    stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7" />

  <!-- Small WiFi indicator (bottom right) -->
  <circle cx="200" cy="208" r="4" fill="white" opacity="0.9" />
  <path d="M189 200 a15 15 0 0 1 22 0" stroke="white" stroke-width="3.5" fill="none"
    stroke-linecap="round" opacity="0.7" />
  <path d="M184 193 a22 22 0 0 1 32 0" stroke="white" stroke-width="3.5" fill="none"
    stroke-linecap="round" opacity="0.5" />
</svg>
